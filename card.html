<title>Cast &amp; Curve</title>
<meta name="description" content="Creative, editorial &amp; themed portrait photography. Follow on Instagram.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Lora",Georgia,"Times New Roman",serif;
  --bg:#1c1c1c;--panel:#262626;--line:#3d3d3d;--text:#f3f3f3;--muted:#a9a9a9;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--body);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.card{
  width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:36px 28px 32px;text-align:center;
}
h1{font:400 2rem/1.2 var(--serif);margin:0 0 2px;letter-spacing:.01em}
h1 span{font-style:italic}
.tagline{color:var(--muted);font-style:italic;font-size:.95rem;margin:0 0 26px}
.qr-wrap{background:#f3f3f3;border-radius:14px;padding:16px;display:inline-block;margin-bottom:22px}
.qr-wrap img{display:block;width:220px;height:220px}
.handle{
  display:inline-block;color:var(--text);text-decoration:none;font-weight:600;
  font-size:1.05rem;border:1px solid var(--text);border-radius:999px;padding:10px 22px;
  transition:background .15s,color .15s;
}
.handle:hover,.handle:active{background:var(--text);color:var(--bg)}
.scan-note{color:var(--muted);font-size:.8rem;margin-top:18px}
.email-note{color:var(--muted);font-size:.78rem;margin-top:6px}
.email-note a{color:inherit}
</style>
</head>
